{% extends "base.html" %} {% block content %}
<h1>{{recipe.name}}</h1>
<h2>Ingredients</h2>
<ul>
    {% for item in recipe.ingredients.all %}
    <li>{{ item.ingredient.name }}: {{ item.quantity }}</li>
    {% endfor %}
</ul>
<p>
    <a href="{% url 'recipe_list' %}">Back to Recipe List</a>
</p>
{% endblock %}
